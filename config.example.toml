# Which events go to which channel.
# Event types: new, restock, price_drop, target
[discord]
webhook_url = ""
events = ["new", "restock", "price_drop", "target"]

[email]
enabled = false
smtp_host = "smtp.gmail.com"
smtp_port = 587
use_starttls = true
username = ""
password = ""
from = ""
to = ""
events = ["restock", "target"]

[push]
# Keys are generated automatically in data/ on first start.
subject = "mailto:you@example.nl"
events = ["new", "restock", "target"]
