# Copy this file to config.toml and fill it in.

[general]
# How often all stores are scanned.
interval_minutes = 15
# Pause between requests to the same store (be polite, avoid getting blocked).
request_delay_seconds = 1.5
# Games to track: pokemon, mtg, naruto
games = ["pokemon", "mtg", "naruto"]
# Catalog-wide price drop alert: only when a product drops at least this many percent.
price_drop_percent = 10
# Public URL of the web app (used for links in notifications).
base_url = "https://tcg.example.nl"

[web]
host = "127.0.0.1"
port = 8080
# Password to log in to the web app / PWA.
password = "change-me"
# Any long random string; changing it logs out all devices.
secret_key = "replace-with-a-long-random-string"

[stores.bescards]
enabled = true

[stores.tcgcompany]
enabled = true

[stores.intertoys]
enabled = true

# bol.com: Pokemon category catalog plus watchlist URLs, via Playwright (see README).
# A catalog_pages value of 0 scans every page; set a positive number to limit each catalog scan.
[stores.bol]
enabled = false
catalog_interval_minutes = 60
catalog_pages = 0
min_interval_minutes = 60
pause_hours_when_blocked = 24

# Public Magento GraphQL catalog. It remains healthy when its TCG category is empty.
[stores.top1toys]
enabled = false

# Server-rendered Pokemon card category; marketplace sellers are excluded.
[stores.mediamarkt]
enabled = false

[stores.tcgshop]
enabled = false

[stores.peppicollect]
